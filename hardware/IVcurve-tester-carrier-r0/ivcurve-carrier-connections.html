<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IV Curve Tester Carrier — Electrical Connections</title>
  <style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
    --analog: #b45309;
    --digital: #2563eb;
    --power: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
      --analog: #f59e0b;
      --digital: #60a5fa;
      --power: #4ade80;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1180px; margin: 28px auto; padding: 0 18px 30px; }
  svg { width: 100%; height: auto; display: block; }
  .title { font-size: 23px; font-weight: 700; fill: var(--fg); }
  .subtitle { font-size: 13px; fill: var(--muted); }
  .label { font-size: 15px; font-weight: 700; fill: var(--fg); }
  .pin { font-size: 12px; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .net { font-size: 11px; font-weight: 700; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .node { stroke: var(--line); stroke-width: 1.2; }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge { stroke: var(--line); stroke-width: 1.8; fill: none; }
  .edge.digital { stroke: var(--digital); }
  .edge.analog { stroke: var(--analog); }
  .edge.power { stroke: var(--power); }
  .zone { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 6 5; opacity: 0.8; }
  .divider { stroke: var(--line); stroke-width: 0.8; opacity: 0.6; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 1180 820" role="img" aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">IV Curve Tester carrier electrical connections</title>
    <desc id="diagram-desc">Connection map for an ESP32-C3 Super Mini, Adafruit FeatherWing e-paper display, onboard ADG706, sixteen load resistors, ADC module, button, and DUT input.</desc>
    <defs>
      <marker id="arrow-digital" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,4 L0,8 Z" fill="var(--digital)" />
      </marker>
      <marker id="arrow-analog" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,4 L0,8 Z" fill="var(--analog)" />
      </marker>
      <marker id="arrow-power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,4 L0,8 Z" fill="var(--power)" />
      </marker>
    </defs>

    <text id="title" class="title" x="24" y="35">IV Curve Tester Carrier — Electrical Connections</text>
    <text class="subtitle" x="24" y="57">ESP32-C3 SUPER MINI · FeatherWing display · onboard ADG706 · 16 switched loads · ADS1115-class ADC · one button</text>

    <!-- Connectors are drawn before component boxes. -->
    <path class="edge digital" d="M310 182 C410 182 405 300 485 300" marker-end="url(#arrow-digital)" />
    <path class="edge digital" d="M310 250 C530 250 720 190 875 190" marker-end="url(#arrow-digital)" />
    <path class="edge digital" d="M310 340 C560 340 710 500 875 500" marker-end="url(#arrow-digital)" />
    <path class="edge digital" d="M310 416 C570 416 720 697 875 697" marker-end="url(#arrow-digital)" />
    <path class="edge analog" d="M340 675 H405 V147 H485" marker-end="url(#arrow-analog)" />
    <path class="edge analog" d="M765 147 H805 V385 H735" marker-end="url(#arrow-analog)" />
    <path class="edge analog" d="M485 191 H420 V638 H340" marker-end="url(#arrow-analog)" />
    <path class="edge analog" d="M340 675 H805 V560 H875" marker-end="url(#arrow-analog)" />
    <path class="edge analog" d="M340 715 H835 V590 H875" marker-end="url(#arrow-analog)" />
    <path class="edge power" d="M310 470 C570 470 735 115 875 115" marker-end="url(#arrow-power)" />
    <path class="edge power" d="M310 485 C590 485 725 460 875 460" marker-end="url(#arrow-power)" />
    <path class="edge power" d="M310 500 C430 500 435 480 485 480" marker-end="url(#arrow-power)" />

    <text class="net" x="372" y="174" fill="var(--digital)">A0–A3 · EN</text>
    <text class="net" x="570" y="221" fill="var(--digital)">SPI · CS · D/C · RESET</text>
    <text class="net" x="590" y="430" fill="var(--digital)">I²C SDA/SCL</text>
    <text class="net" x="632" y="620" fill="var(--digital)">BUTTON_N</text>
    <text class="net" x="412" y="135" fill="var(--analog)">DUT_P common</text>
    <text class="net" x="770" y="244" fill="var(--analog)">R1…R16 → J2</text>
    <text class="net" x="390" y="604" fill="var(--analog)">D → DUT_N</text>
    <text class="net" x="760" y="548" fill="var(--analog)">ADC A0 sense</text>
    <text class="net" x="690" y="704" fill="var(--analog)">ADC reference</text>

    <rect class="node process" x="24" y="92" width="286" height="444" rx="14" />
    <text class="label" x="48" y="122">ESP32-C3 SUPER MINI</text>
    <line class="divider" x1="48" y1="135" x2="286" y2="135" />
    <text class="pin" x="48" y="160">MUX: GPIO2=A0 · 6=A1 · 4=A2 · 5=A3</text>
    <text class="pin" x="48" y="181">MUX enable: GPIO14</text>
    <text class="pin" x="48" y="218">Display SPI: SCK12 · MOSI11 · MISO13</text>
    <text class="pin" x="48" y="239">Display control: CS37 · D/C38 · SRAM_CS33</text>
    <text class="pin" x="48" y="260">Display reset: S3 EN/reset · BUSY unused</text>
    <text class="pin" x="48" y="306">ADC I²C: SDA8 · SCL9 · address 0x48</text>
    <text class="pin" x="48" y="353">Button: GPIO35 with internal pull-up</text>
    <text class="pin" x="48" y="400">Power: USB-C → S3 · carrier logic at 3.3 V</text>
    <text class="pin" x="48" y="421">Ground: one continuous reference plane</text>
    <text class="pin" x="48" y="472">Unused controller pins: explicit no-connect</text>
    <text class="small" x="48" y="510">Keep copper and traces away from the S3 antenna area.</text>

    <rect class="node external" x="485" y="84" width="280" height="140" rx="14" />
    <text class="label" x="509" y="114">16 load resistors</text>
    <text class="pin" x="509" y="141">Common end: DUT_P</text>
    <text class="pin" x="509" y="162">Switched ends: R1…R16 → S1…S16</text>
    <text class="pin" x="509" y="183">Draft: 1 MΩ … 18 Ω</text>
    <text class="small" x="509" y="207">Store measured total path resistance per channel.</text>

    <rect class="node storage" x="485" y="264" width="250" height="282" rx="14" />
    <text class="label" x="509" y="294">Onboard ADG706 multiplexer</text>
    <line class="divider" x1="509" y1="307" x2="711" y2="307" />
    <text class="pin" x="509" y="334">J1.1 GND · J1.2 VCC · J1.3 EN</text>
    <text class="pin" x="509" y="356">J1.4 A0 · 1.5 A1 · 1.6 A2 · 1.7 A3</text>
    <text class="pin" x="509" y="378">J1.8 D = load return to DUT_N</text>
    <text class="pin" x="509" y="417">J2.1…16 = S1…S16</text>
    <text class="pin" x="509" y="454">0000 selects S1 · 1111 selects S16</text>
    <text class="small" x="509" y="493">Enable stays low at boot and outside measurements.</text>
    <text class="small" x="509" y="516">S/D continuous absolute maximum: 30 mA.</text>

    <rect class="node input" x="875" y="84" width="281" height="253" rx="14" />
    <text class="label" x="899" y="114">Adafruit FeatherWing display</text>
    <text class="small" x="899" y="136">Target #4814 tri-color · factory female sockets</text>
    <line class="divider" x1="899" y1="149" x2="1132" y2="149" />
    <text class="pin" x="899" y="174">Pad 1 RESET → S3 EN/reset</text>
    <text class="pin" x="899" y="195">Pad 2 3V3 · pad 4 GND</text>
    <text class="pin" x="899" y="216">Pad 11 SCK · 12 MOSI · 13 MISO</text>
    <text class="pin" x="899" y="237">Pad 20 SRAM_CS · 21 EINK_CS · 22 D/C</text>
    <text class="pin" x="899" y="258">Pad 19 SD_CS unused</text>
    <text class="pin" x="899" y="279">BUSY breakout pad unused</text>
    <text class="small" x="899" y="310">Mating headers: 1x16 + 1x12, 2.54 mm pitch.</text>

    <rect class="node neutral" x="875" y="410" width="281" height="222" rx="14" />
    <text class="label" x="899" y="440">GY-ADS1115 / ADS1015 module</text>
    <text class="small" x="899" y="461">Confirm the actual IC before the footprint is released.</text>
    <line class="divider" x1="899" y1="474" x2="1132" y2="474" />
    <text class="pin" x="899" y="500">VDD=3V3 · GND=DUT_N</text>
    <text class="pin" x="899" y="522">SDA=GPIO8 · SCL=GPIO9</text>
    <text class="pin" x="899" y="544">ADDR=GND · ALERT unused</text>
    <text class="pin" x="899" y="566">A0 = protected DUT_P sense</text>
    <text class="pin" x="899" y="588">A1…A3 unused in carrier r0</text>
    <text class="small" x="899" y="614">ADC input must remain within the 3.3 V supply rails.</text>

    <rect class="node external" x="24" y="638" width="316" height="116" rx="14" />
    <text class="label" x="48" y="668">DUT input</text>
    <text class="pin" x="48" y="694">DUT_P → resistor common + protected ADC A0</text>
    <text class="pin" x="48" y="717">DUT_N → MUX D + ADC GND + carrier GND</text>
    <text class="small" x="48" y="741">Mark polarity on connector and silkscreen.</text>

    <rect class="node external" x="875" y="666" width="281" height="79" rx="14" />
    <text class="label" x="899" y="696">Measure button</text>
    <text class="pin" x="899" y="721">GPIO35 ↔ normally-open switch ↔ GND</text>

    <rect class="zone" x="20" y="775" width="1136" height="32" rx="8" />
    <text class="small" x="36" y="796">Release condition: defined DUT limits · measured channel resistances · ERC 0 · DRC 0 · no unconnected items · filled and reviewed GND plane</text>
  </svg>
</main>
</body>
</html>
